[project]
name = "mcp-browser"
version = "0.1.0"
description = "Browse, search, run and edit every MCP server configured on this machine"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mcp-browser-core==0.1.0",
    "mcp-browser-server==0.1.0",
]

[project.scripts]
mcp-browser = "mcp_browser.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_browser"]

[tool.uv.sources]
mcp-browser-core = { workspace = true }
mcp-browser-server = { workspace = true }
