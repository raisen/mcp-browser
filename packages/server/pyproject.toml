[project]
name = "mcp-browser-server"
version = "0.2.0"
description = "Local web server and UI for mcp-browser"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mcp-browser-core==0.2.0",
    "starlette",
    "uvicorn",
    "jsonschema",
    "pydantic>=2.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_browser_server"]

[tool.uv.sources]
mcp-browser-core = { workspace = true }
