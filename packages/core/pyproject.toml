[project]
name = "mcp-browser-core"
version = "0.2.0"
description = "Config discovery, safe rewriting and MCP client layer for mcp-browser"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "httpx2>=2.10",
    "anyio>=4",
    "pydantic>=2.12",
    "tomlkit",
    "json5",
    "filelock",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_browser_core"]
